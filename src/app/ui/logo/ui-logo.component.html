<div
  class="ui-logo"
  [class.ui-logo--icon-only]="iconOnly"
  [class.ui-logo--stacked]="stacked"
  [class.ui-logo--sm]="size === 'sm'"
  [class.ui-logo--md]="size === 'md'"
  [class.ui-logo--lg]="size === 'lg'"
>
  <svg class="ui-logo__mark" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <circle class="ui-logo__ring" cx="50" cy="50" r="45"></circle>
    <path class="ui-logo__line" d="M40 58c8-20 22-31 37-32-1 15-12 28-32 36l-5-4z"></path>
    <path class="ui-logo__line" d="M45 63v18c0 1 1 2 2 2 12-2 17-9 17-20 0-4-1-7-2-9"></path>
    <path class="ui-logo__line" d="M40 58H23c-1 0-2-1-2-2 2-11 8-17 19-17 4 0 7 1 9 2"></path>
    <path class="ui-logo__line" d="M35 70c-4 0-7 1-9 2-5 2-8 7-9 18 0 1 1 2 2 2 10-1 16-4 18-9 1-2 2-5 2-9"></path>
  </svg>

  <div class="ui-logo__text">
    <span class="ui-logo__word ui-logo__word--rocket">Rocket</span>
    <span class="ui-logo__word ui-logo__word--post">Post</span>
  </div>
</div>
