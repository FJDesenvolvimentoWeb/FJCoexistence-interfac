<mat-form-field
  appearance="outline"
  class="ui-text-field"
  floatLabel="auto"
  [hideRequiredMarker]="true"
>
  <input
    matInput
    [type]="type"
    [placeholder]="placeholder"
    [formControl]="control!"
  />

  <mat-hint *ngIf="hint">{{ hint }}</mat-hint>

  <mat-error *ngIf="control?.invalid && (control?.touched || control?.dirty)">
    {{ getErrorMessage() }}
  </mat-error>
</mat-form-field>
