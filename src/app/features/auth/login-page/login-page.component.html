<div class="login-page">
  <div class="bg-layer"></div>
  <div class="login-wrapper">
    <ui-card>
      <ng-container card-header>
        <div class="brand-icon" aria-hidden>
          <ui-logo [size]="'lg'" [stacked]="true"></ui-logo>
        </div>
      </ng-container>

      <div class="login-content">
        <h1 class="title">Acesse sua conta</h1>
        <p class="subtitle">Entre para gerenciar suas conversas e oportunidades</p>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
          <ui-text-field
            label="Email"
            placeholder="seu@email.com"
            [control]="email"
          ></ui-text-field>

          <div class="password-label-row">
            <label class="password-label">Senha</label>
            <a class="forgot-link" routerLink="/forgot-password">Esqueceu a senha?</a>
          </div>

          <ui-text-field [type]="'password'" placeholder="*******" [control]="password"></ui-text-field>

          <ui-button
            [type]="'submit'"
            [variant]="'primary'"
            [fullWidth]="true"
            [loading]="(isLoading$ | async) ?? false"
            [disabled]="form.invalid || ((isLoading$ | async) ?? false)"
          >
            Entrar
          </ui-button>

          <div class="error-message" *ngIf="(errorMessage$ | async) as errorMessage">
            {{ errorMessage }}
          </div>
        </form>

        <div class="spacer"></div>

        <ui-divider-label [label]="'PRIMEIRA VEZ AQUI?'"></ui-divider-label>

        <ui-button [variant]="'secondary'" [fullWidth]="true" (clicked)="goRegister()">
          Criar conta
        </ui-button>
      </div>
    </ui-card>

    <footer class="page-footer">(c) 2026 Rocket Post</footer>
  </div>
</div>
